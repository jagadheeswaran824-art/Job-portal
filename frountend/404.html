<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | JobPortal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#f6f8fc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .wrap{text-align:center;max-width:480px;}
        .num{font-size:120px;font-weight:900;color:#e5e7eb;line-height:1;letter-spacing:-4px;}
        .icon{font-size:50px;color:#4f46e5;margin:8px 0 20px;}
        h1{font-size:26px;font-weight:800;color:#111827;margin-bottom:10px;}
        p{color:#6b7280;font-size:15px;line-height:1.7;margin-bottom:28px;}
        .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
        .btn-p{padding:12px 24px;border-radius:10px;background:#4f46e5;color:white;font-weight:700;font-size:14px;text-decoration:none;transition:.2s;}
        .btn-p:hover{background:#4338ca;}
        .btn-s{padding:12px 24px;border-radius:10px;border:1.5px solid #e5e7eb;color:#374151;font-weight:700;font-size:14px;text-decoration:none;transition:.2s;}
        .btn-s:hover{border-color:#4f46e5;color:#4f46e5;}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="num">404</div>
        <div class="icon"><i class="fa-solid fa-magnifying-glass"></i></div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
        <div class="actions">
            <a href="index.html" class="btn-p"><i class="fa-solid fa-house" style="margin-right:6px;"></i>Home</a>
            <a href="jobs.html" class="btn-s"><i class="fa-solid fa-briefcase" style="margin-right:6px;"></i>Browse Jobs</a>
        </div>
    </div>
</body>
</html>
