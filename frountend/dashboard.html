<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | JobPortal AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #f6f8fc; }

        /* Layout */
        .dash-layout {
            max-width: 1240px; margin: 0 auto; padding: 36px 20px 70px;
            display: grid; grid-template-columns: 240px 1fr; gap: 28px;
        }

        /* Sidebar */
        .dash-sidebar { height: fit-content; position: sticky; top: 80px; }
        .user-card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 18px;
            padding: 22px; text-align: center; margin-bottom: 16px;
        }
        .user-avatar {
            width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(135deg,#4f46e5,#7c3aed);
            color: #fff; font-size: 22px; font-weight: 800;
            display: grid; place-items: center; margin: 0 auto 12px;
        }
        .user-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .user-card p  { font-size: 12px; color: #6b7280; }
        .user-role {
            display: inline-block; margin-top: 8px;
            padding: 4px 10px; border-radius: 50px;
            background: #eef2ff; color: #4f46e5;
            font-size: 11px; font-weight: 700; text-transform: capitalize;
        }
        .dash-nav {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 18px;
            padding: 10px; overflow: hidden;
        }
        .dash-nav a {
            display: flex; align-items: center; gap: 11px;
            padding: 11px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600; color: #6b7280;
            text-decoration: none; transition: .18s;
        }
        .dash-nav a i { width: 16px; text-align: center; color: #9ca3af; }
        .dash-nav a:hover { background: #f9fafb; color: #111827; }
        .dash-nav a.active { background: #eef2ff; color: #4f46e5; }
        .dash-nav a.active i { color: #4f46e5; }
        .nav-divider { height: 1px; background: #f3f4f6; margin: 6px 0; }

        /* Main */
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 26px; flex-wrap: wrap; gap: 12px;
        }
        .page-header h1 { font-size: 24px; font-weight: 800; }
        .page-header p  { color: #6b7280; font-size: 13px; margin-top: 4px; }

        /* Stat cards */
        .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 26px; }
        .stat-tile {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
            padding: 20px; transition: .22s;
        }
        .stat-tile:hover { box-shadow: 0 8px 24px rgba(15,23,42,.07); }
        .st-icon {
            width: 42px; height: 42px; border-radius: 11px;
            display: grid; place-items: center; font-size: 18px; margin-bottom: 14px;
        }
        .st-val { font-size: 28px; font-weight: 800; color: #111827; line-height: 1; }
        .st-label { font-size: 12px; color: #6b7280; margin-top: 5px; }

        /* Section card */
        .section-card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 18px;
            padding: 24px; margin-bottom: 22px;
        }
        .sc-head {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .sc-head h2 { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .sc-head a  { font-size: 12px; color: #4f46e5; font-weight: 700; text-decoration: none; }

        /* Application rows & Pipeline */
        .app-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 0; border-bottom: 1px solid #f3f4f6; flex-wrap: wrap;
        }
        .app-row:last-child { border-bottom: none; padding-bottom: 0; }
        .app-logo {
            width: 42px; height: 42px; border-radius: 10px;
            display: grid; place-items: center; font-size: 13px; font-weight: 800; flex-shrink: 0;
        }
        .app-info { flex: 1; min-width: 200px; }
        .app-info h4 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .app-info p  { font-size: 12px; color: #6b7280; }
        .status-badge {
            padding: 4px 10px; border-radius: 50px; font-size: 11px; font-weight: 700; text-transform: capitalize; white-space: nowrap;
        }

        /* Pipeline Steps */
        .pipeline-track {
            display: flex; gap: 6px; align-items: center; margin-top: 8px; width: 100%; overflow-x: auto; padding-bottom: 4px;
        }
        .pipe-step {
            font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #f1f5f9; color: #94a3b8; white-space: nowrap;
        }
        .pipe-step.active { background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; }
        .pipe-step.current { background: #4f46e5; color: #fff; }

        /* Quick actions */
        .quick-actions { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 22px; }
        .qa-btn {
            display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px;
            background: #fff; border: 1px solid #e5e7eb; text-decoration: none; color: #374151;
            font-size: 13px; font-weight: 600; transition: .2s;
        }
        .qa-btn i {
            width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; flex-shrink: 0;
        }
        .qa-btn:hover { border-color: #c7d2fe; background: #fafbff; color: #4f46e5; }

        /* Modals */
        .modal-backdrop {
            display: none; position: fixed; inset: 0; z-index: 200; background: rgba(15,23,42,.55);
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
            background: #fff; border-radius: 20px; padding: 28px; max-width: 580px; width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .modal-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close { border: none; background: none; font-size: 22px; cursor: pointer; color: #6b7280; }

        /* Responsive */
        @media (max-width: 900px) {
            .dash-layout { grid-template-columns: 1fr; }
            .dash-sidebar { position: static; }
            .stats-row { grid-template-columns: repeat(2,1fr); }
            .quick-actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">
            <span class="logo-icon"><i class="fa-solid fa-briefcase"></i></span>
            Job<span>Portal</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="companies.html">Companies</a>
            <a href="career.html">AI Career</a>
            <a href="security-check.html"><i class="fa-solid fa-shield-halved" style="color:#10b981;margin-right:4px;"></i>Safety Check</a>
            <a href="about.html">About</a>
        </nav>
        <div class="nav-actions">
            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="register-btn">Get Started</a>
        </div>
        <button class="mobile-menu" id="mobileMenu" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
        </button>

</header>

<div class="dash-layout">

    <!-- SIDEBAR -->
    <aside class="dash-sidebar">
        <div class="user-card">
            <div class="user-avatar" id="userAvatar">?</div>
            <h3 id="userName">Loading…</h3>
            <p id="userEmail"></p>
            <span class="user-role" id="userRole">—</span>
        </div>
        <nav class="dash-nav" id="dashNav">
            <!-- Populated by JS -->
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="dash-main" id="dashMain">
        <div style="display:flex;align-items:center;justify-content:center;padding:80px;gap:14px;color:#6b7280;">
            <span class="spinner spinner-dark"></span> Loading dashboard…
        </div>
    </main>
</div>

<!-- RESUME ANALYZER MODAL -->
<div class="modal-backdrop" id="resumeModal">
    <div class="modal">
        <div class="modal-hd">
            <h2><i class="fa-solid fa-file-invoice" style="color:#4f46e5; margin-right:8px;"></i> AI Resume Analyzer</h2>
            <button class="modal-close" onclick="document.getElementById('resumeModal').classList.remove('open')">&times;</button>
        </div>
        <div style="margin-bottom:16px;">
            <label style="display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:6px;">Paste Resume Text (PDF/DOCX/TXT content):</label>
            <textarea id="resumeTextInput" placeholder="Paste your complete resume text or project experience here…" style="width:100%; min-height:160px; padding:12px; border-radius:10px; border:1px solid #d1d5db; font-family:inherit; font-size:13px;"></textarea>
        </div>
        <button id="runResumeAnalysisBtn" style="width:100%; padding:12px; border-radius:10px; border:none; background:#4f46e5; color:#fff; font-weight:800; cursor:pointer;">
            <i class="fa-solid fa-sparkles"></i> Run AI ATS Analysis
        </button>
        <div id="resumeAnalysisResult" style="margin-top:20px; display:none;"></div>
    </div>
</div>

<!-- INTERVIEW SCHEDULING MODAL (EMPLOYER) -->
<div class="modal-backdrop" id="scheduleModal">
    <div class="modal">
        <div class="modal-hd">
            <h2><i class="fa-solid fa-calendar-plus" style="color:#4f46e5; margin-right:8px;"></i> Schedule Candidate Interview</h2>
            <button class="modal-close" onclick="document.getElementById('scheduleModal').classList.remove('open')">&times;</button>
        </div>
        <form id="scheduleForm">
            <input type="hidden" id="schCandidateId" />
            <input type="hidden" id="schJobId" />
            <input type="hidden" id="schAppId" />
            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:6px;">Candidate</label>
                <input type="text" id="schCandidateName" readonly style="width:100%; padding:10px; border-radius:8px; border:1px solid #e5e7eb; background:#f8fafc; font-size:13px;" />
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;">
                <div>
                    <label style="display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:6px;">Date</label>
                    <input type="date" id="schDate" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #d1d5db; font-size:13px;" />
                </div>
                <div>
                    <label style="display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:6px;">Time</label>
                    <input type="time" id="schTime" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #d1d5db; font-size:13px;" />
                </div>
            </div>
            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:6px;">Interview Type</label>
                <select id="schType" style="width:100%; padding:10px; border-radius:8px; border:1px solid #d1d5db; font-size:13px;">
                    <option value="video">Online Video (Google Meet / Zoom)</option>
                    <option value="technical_round">Technical Coding Round</option>
                    <option value="hr_round">HR & Culture Round</option>
                    <option value="phone">Phone Screening</option>
                    <option value="in_person">In-Person Office</option>
                </select>
            </div>
            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:6px;">Meeting Link / Location</label>
                <input type="text" id="schMeetingLink" placeholder="https://meet.google.com/xxx-xxxx-xxx" style="width:100%; padding:10px; border-radius:8px; border:1px solid #d1d5db; font-size:13px;" />
            </div>
            <div style="margin-bottom:18px;">
                <label style="display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:6px;">Instructions / Notes</label>
                <textarea id="schNotes" placeholder="Preparation notes or agenda…" style="width:100%; min-height:70px; padding:10px; border-radius:8px; border:1px solid #d1d5db; font-size:13px; font-family:inherit;"></textarea>
            </div>
            <button type="submit" style="width:100%; padding:12px; border-radius:10px; border:none; background:#4f46e5; color:#fff; font-weight:800; cursor:pointer;">
                Confirm & Schedule Interview
            </button>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script>
'use strict';

Auth.redirectIfGuest();
const user = Auth.getUser();

if (user) {
    const initials = user.full_name
        ? user.full_name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase()
        : '?';
    document.getElementById('userAvatar').textContent = initials;
    document.getElementById('userName').textContent   = user.full_name || 'User';
    document.getElementById('userEmail').textContent  = user.email || '';
    document.getElementById('userRole').textContent   = (user.role || '').replace('_', ' ');
}

function buildSidebarNav(role, activeTab = 'dashboard') {
    const isEmployer = role === 'employer' || role === 'admin';
    const isAdmin = role === 'admin';
    const nav = document.getElementById('dashNav');
    nav.innerHTML = `
        <a href="dashboard.html" class="${activeTab === 'dashboard' ? 'active' : ''}"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="career.html"><i class="fa-solid fa-sparkles" style="color:#4f46e5;"></i> AI Career GPS</a>
        <a href="security-check.html"><i class="fa-solid fa-shield-halved" style="color:#10b981;"></i> URL Safety Check</a>
        ${isAdmin ? `
        <a href="javascript:void(0)" onclick="renderAdminSecurityCenter()" class="${activeTab === 'security' ? 'active' : ''}" style="color:#dc2626; font-weight:700;">
            <i class="fa-solid fa-shield-virus" style="color:#dc2626;"></i> Security Center
        </a>
        ` : ''}
        ${isEmployer ? `
        <a href="post-job.html"><i class="fa-solid fa-plus-circle"></i> Post a Job</a>
        ` : `
        <a href="jobs.html"><i class="fa-solid fa-magnifying-glass"></i> Find Jobs</a>
        `}
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <div class="nav-divider"></div>
        <a href="#" onclick="AuthAPI.logout();return false;" style="color:#dc2626;">
            <i class="fa-solid fa-right-from-bracket" style="color:#dc2626;"></i> Logout
        </a>`;
}

function brandColor(name) {
    const p = [
        {bg:'#eef2ff',text:'#4f46e5'},{bg:'#fef3c7',text:'#d97706'},
        {bg:'#dcfce7',text:'#16a34a'},{bg:'#dbeafe',text:'#2563eb'},
        {bg:'#ede9fe',text:'#7c3aed'},{bg:'#fce7f3',text:'#be185d'},
    ];
    if (!name) return p[0];
    let h = 0;
    for (let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h);
    return p[Math.abs(h)%p.length];
}

function statusBadge(s) {
    const map = {
        pending:'#fef3c7:#92400e', reviewing:'#dbeafe:#1e40af',
        shortlisted:'#d1fae5:#065f46', assessment:'#fef3c7:#b45309',
        interview:'#ede9fe:#5b21b6', offered:'#dcfce7:#14532d',
        rejected:'#fee2e2:#991b1b', withdrawn:'#f3f4f6:#6b7280',
    };
    const [bg,color] = (map[s] || '#f3f4f6:#6b7280').split(':');
    return `<span class="status-badge" style="background:${bg};color:${color};">${escHtml(s)}</span>`;
}

async function loadDashboard() {
    try {
        const res  = await DashboardAPI.overview();
        const data = res.data;
        buildSidebarNav(data.role);

        // Fetch interviews
        const intRes = await InterviewsAPI.my().catch(() => ({ data: [] }));
        const interviews = intRes.data || [];

        if (data.role === 'employer' || data.role === 'admin') {
            renderEmployerDash(data, interviews);
        } else {
            renderSeekerDash(data, interviews);
        }
    } catch (err) {
        document.getElementById('dashMain').innerHTML = `
            <div style="text-align:center;padding:60px;color:#6b7280;">
                <i class="fa-solid fa-triangle-exclamation" style="font-size:40px;color:#fbbf24;margin-bottom:14px;display:block;"></i>
                <h3 style="margin-bottom:8px;">Could not load dashboard</h3>
                <p>${escHtml(err.message || 'Server error')}</p>
                <button onclick="location.reload()" style="margin-top:16px;padding:10px 22px;border-radius:8px;border:none;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer;">Retry</button>
            </div>`;
        buildSidebarNav(user?.role || 'job_seeker');
    }
}

// ── Job Seeker Dashboard ──────────────────────────────────────────────────────
function renderSeekerDash(data, interviews = []) {
    const s = data.statistics;
    const apps = data.recent_applications || [];
    const saved = data.saved_jobs || [];

    const pipelineStages = ['Applied', 'Reviewing', 'Shortlisted', 'Interview', 'Offered'];

    document.getElementById('dashMain').innerHTML = `
        <div class="page-header">
            <div>
                <h1>Welcome back, ${escHtml((user?.full_name || 'there').split(' ')[0])} 👋</h1>
                <p>AI Career Intelligence & Application Management Dashboard</p>
            </div>
            <a href="career.html" class="btn-primary" style="background:linear-gradient(135deg,#4f46e5,#7c3aed); text-decoration:none; padding:10px 18px; border-radius:10px; color:#fff; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-sparkles"></i> Open Career GPS
            </a>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-tile">
                <div class="st-icon" style="background:#eef2ff;color:#4f46e5;"><i class="fa-solid fa-paper-plane"></i></div>
                <div class="st-val">${s.applications}</div>
                <div class="st-label">Applications</div>
            </div>
            <div class="stat-tile">
                <div class="st-icon" style="background:#fef3c7;color:#d97706;"><i class="fa-solid fa-bookmark"></i></div>
                <div class="st-val">${s.saved_jobs}</div>
                <div class="st-label">Saved Jobs</div>
            </div>
            <div class="stat-tile">
                <div class="st-icon" style="background:#ede9fe;color:#7c3aed;"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="st-val">${interviews.length}</div>
                <div class="st-label">Scheduled Interviews</div>
            </div>
            <div class="stat-tile">
                <div class="st-icon" style="background:#dcfce7;color:#16a34a;"><i class="fa-solid fa-trophy"></i></div>
                <div class="st-val">85%</div>
                <div class="st-label">Job Readiness Score</div>
            </div>
        </div>

        <!-- Quick actions -->
        <div class="quick-actions">
            <a href="javascript:void(0)" onclick="openResumeModal()" class="qa-btn">
                <i class="fa-solid fa-file-invoice" style="background:#eef2ff;color:#4f46e5;"></i>
                <div><strong>AI Resume Analyzer</strong><br><small style="color:#6b7280;font-weight:400;">Extract & check ATS score</small></div>
            </a>
            <a href="career.html" class="qa-btn">
                <i class="fa-solid fa-route" style="background:#faf5ff;color:#7c3aed;"></i>
                <div><strong>Career GPS Roadmap</strong><br><small style="color:#6b7280;font-weight:400;">View skill milestones</small></div>
            </a>
            <a href="jobs.html" class="qa-btn">
                <i class="fa-solid fa-magnifying-glass" style="background:#f0fdf4;color:#16a34a;"></i>
                <div><strong>Natural Search Jobs</strong><br><small style="color:#6b7280;font-weight:400;">Browse AI-matched jobs</small></div>
            </a>
        </div>

        <!-- Scheduled Interviews Section -->
        ${interviews.length ? `
        <div class="section-card" style="border-left:4px solid #7c3aed;">
            <div class="sc-head">
                <h2><i class="fa-solid fa-calendar-check" style="color:#7c3aed;"></i> Upcoming Scheduled Interviews</h2>
            </div>
            <div style="display:grid; gap:12px;">
                ${interviews.map(i => `
                    <div style="background:#f8fafc; padding:16px; border-radius:12px; border:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                        <div>
                            <h4 style="font-size:14px; font-weight:700; color:#0f172a;">${escHtml(i.job_title)} at ${escHtml(i.company_name)}</h4>
                            <p style="font-size:12px; color:#64748b; margin-top:3px;">
                                <i class="fa-solid fa-calendar"></i> ${i.interview_date} at ${i.interview_time} · <span style="text-transform:capitalize;">${escHtml(i.interview_type)}</span>
                            </p>
                            ${i.notes ? `<p style="font-size:12px; color:#475569; margin-top:4px;"><strong>Notes:</strong> ${escHtml(i.notes)}</p>` : ''}
                        </div>
                        <div style="display:flex; gap:8px;">
                            ${i.meeting_link ? `<a href="${escHtml(i.meeting_link)}" target="_blank" style="padding:8px 14px; border-radius:8px; background:#4f46e5; color:#fff; font-size:12px; font-weight:700; text-decoration:none;"><i class="fa-solid fa-video"></i> Join Meeting</a>` : ''}
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>` : ''}

        <!-- Application Intelligence Tracker -->
        <div class="section-card">
            <div class="sc-head">
                <h2><i class="fa-solid fa-timeline" style="color:#4f46e5;"></i> Application Intelligence Pipeline</h2>
                <a href="jobs.html">Browse more jobs</a>
            </div>
            ${apps.length ? apps.map(a => {
                const c = brandColor(a.company_name);
                const currentStatus = (a.status || 'pending').toLowerCase();
                return `
                <div class="app-row">
                    <div class="app-logo" style="background:${c.bg};color:${c.text};">${(a.company_name||'?')[0].toUpperCase()}</div>
                    <div class="app-info">
                        <h4>${escHtml(a.job_title)}</h4>
                        <p>${escHtml(a.company_name)} · ${escHtml(a.location || '')}</p>
                        <!-- Pipeline visualization -->
                        <div class="pipeline-track">
                            <span class="pipe-step ${currentStatus === 'pending' ? 'current' : 'active'}">1. Applied</span>
                            <span class="pipe-step ${['reviewing','shortlisted','interview','offered'].includes(currentStatus) ? (currentStatus==='reviewing'?'current':'active') : ''}">2. Review</span>

async function handleReportStatusUpdate(reportId, status) {
    try {
        await AdminAPI.updateReportStatus(reportId, status);
        showToast(`Report updated to '${status}'`, 'success');
        renderAdminSecurityCenter();
    } catch (err) {
        showToast(err.message || 'Failed to update report status', 'error');
    }
}

async function handleJobModeration(jobId, action, reportId) {
    const confirmMsg = action === 'suspend_job'
        ? 'Are you sure you want to suspend this job listing?'
        : action === 'suspend_recruiter'
        ? 'Are you sure you want to ban this recruiter and suspend all their job postings?'
        : 'Confirm moderation action?';

    if (!confirm(confirmMsg)) return;

    try {
        await AdminAPI.takeJobSecurityAction(jobId, action, reportId);
        showToast(`Security action '${action}' applied successfully!`, 'success');
        renderAdminSecurityCenter();
    } catch (err) {
        showToast(err.message || 'Failed to enforce security action', 'error');
    }
}

// ── Open Schedule Interview Modal ─────────────────────────────────────────────
function openScheduleModal(candId, jobId, appId, candName) {
    document.getElementById('schCandidateId').value = candId;
    document.getElementById('schJobId').value = jobId;
    document.getElementById('schAppId').value = appId;
    document.getElementById('schCandidateName').value = candName;
    document.getElementById('scheduleModal').classList.add('open');
}

document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const payload = {
            candidate_id: parseInt(document.getElementById('schCandidateId').value, 10),
            job_id: parseInt(document.getElementById('schJobId').value, 10),
            application_id: parseInt(document.getElementById('schAppId').value, 10),
            interview_date: document.getElementById('schDate').value,
            interview_time: document.getElementById('schTime').value,
            interview_type: document.getElementById('schType').value,
            meeting_link: document.getElementById('schMeetingLink').value,
            notes: document.getElementById('schNotes').value,
        };

        await InterviewsAPI.schedule(payload);
        document.getElementById('scheduleModal').classList.remove('open');
        showToast('Interview successfully scheduled with candidate! 📅', 'success');
        loadDashboard();
    } catch (err) {
        showToast(err.message || 'Scheduling failed', 'error');
    }
});

// ── Init ──────────────────────────────────────────────────────────────────────
loadDashboard();
</script>
